[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rosterops"
dynamic = ["version"]
description = "Deterministic, configurable, Polars-based pharma roster processing and validation engine"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "rosterops contributors" }]
keywords = ["pharma", "roster", "validation", "polars", "effective-dates"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Typing :: Typed",
]
dependencies = [
    "polars>=1.0,<3.0",
    "pydantic>=2.6,<3.0",
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
excel = [
    "python-calamine>=0.3,<1.0",
    "openpyxl>=3.1,<4.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "build>=1.2",
    "types-PyYAML>=6.0",
]

[project.scripts]
rosterops = "rosterops.cli:main"

[tool.hatch.version]
path = "src/rosterops/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rosterops"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["rosterops"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/rosterops"]
warn_unused_ignores = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["rosterops"]
branch = false

[tool.coverage.report]
show_missing = true
skip_empty = true
